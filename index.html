<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07080f" />
  <title>Kenji Lifts</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #07080f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 95px;
      overflow-x: hidden;
    }

    .aurora-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
    }
    .blob-1 {
      width: 280px;
      height: 280px;
      background: #7e22ce;
      top: -30px;
      right: -60px;
    }
    .blob-2 {
      width: 300px;
      height: 300px;
      background: #0891b2;
      bottom: 25%;
      left: -80px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(12, 14, 24, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      max-width: 440px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .glass-card {
      background: rgba(17, 20, 32, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8);
    }

    .glass-well {
      background: rgba(8, 10, 18, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px;
    }

    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .split-btn {
      padding: 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: rgba(10, 12, 20, 0.7);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s;
    }
    .split-btn.active {
      background: rgba(126, 34, 206, 0.3);
      color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.5);
    }

    .custom-select {
      width: 100%;
      background: rgba(17, 20, 32, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      outline: none;
    }
    .custom-select option {
      background: #090b14;
      color: #ffffff;
    }

    .stepper-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0;
    }
    .stepper-box {
      background: rgba(8, 10, 18, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }
    .stepper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }
    .stepper-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .stepper-btn:active {
      transform: scale(0.9);
    }
    .stepper-val {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
    }

    .btn-log {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: linear-gradient(135deg, rgba(126, 34, 206, 0.75) 0%, rgba(14, 116, 144, 0.75) 100%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-log:active {
      transform: scale(0.98);
    }

    .btn-complete {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: 1px solid rgba(34, 211, 238, 0.4);
      background: rgba(8, 51, 68, 0.85);
      color: #a5f3fc;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
    }

    .bottom-dock {
      position: fixed;
      bottom: 12px;
      left: 14px;
      right: 14px;
      max-width: 440px;
      margin: 0 auto;
      z-index: 40;
      display: flex;
      justify-content: space-around;
      background: rgba(12, 14, 24, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 8px 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.9);
    }
    .dock-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 12px;
    }
    .dock-btn.active {
      color: #e9d5ff;
      background: rgba(126, 34, 206, 0.35);
      border: 1px solid rgba(168, 85, 247, 0.35);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
  </style>
</head>
<body>

  <div class="aurora-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div style="display:flex; align-items:center; gap:10px;">
      <canvas id="logo-canvas" width="40" height="40" style="width:36px; height:36px; border-radius:10px; border:1px solid rgba(168,85,247,0.3);"></canvas>
      <div>
        <h1 style="font-size:15px; font-weight:800; letter-spacing:0.8px; color:#ffffff;">KENJI LIFTS</h1>
        <p id="user-stats-banner" style="font-size:10px; font-weight:700; color:#64748b;">BW: -- kg</p>
      </div>
    </div>
    
    <button onclick="toggleTimerModal()" style="padding:6px 12px; border-radius:30px; background:rgba(8,145,178,0.18); border:1px solid rgba(34,211,238,0.3); color:#22d3ee; font-size:11px; font-weight:800; cursor:pointer;">
      <span id="timer-display">REST</span>
    </button>
  </header>

  <!-- Main Container -->
  <main class="main-wrap">

    <!-- TAB 1: WORKOUT LOGGING -->
    <section id="tab-log" style="display:flex; flex-direction:column; gap:14px;">
      <div>
        <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.8px; display:block; margin-bottom:6px;">Workout Split</span>
        <div class="split-grid" id="split-buttons"></div>
      </div>

      <div>
        <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:0.8px; display:block; margin-bottom:6px;">Select Exercise</span>
        <select id="exercise-select" onchange="renderExerciseDetails()" class="custom-select"></select>
      </div>

      <div class="glass-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span id="target-muscle-badge" style="font-size:10px; font-weight:800; padding:4px 10px; border-radius:20px; background:rgba(126,34,206,0.3); color:#e9d5ff; border:1px solid rgba(168,85,247,0.3); text-transform:uppercase;">CHEST</span>
          <span id="lift-rating-badge" style="font-size:11px; font-weight:800; color:#22d3ee;">Rating: --</span>
        </div>

        <div class="glass-well" style="margin-bottom:12px;">
          <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; display:block; margin-bottom:3px;">Previous Session</span>
          <p id="prev-log-display" style="font-size:12px; color:#cbd5e1; font-style:italic;">No logged lifts for this exercise.</p>
        </div>

        <div class="stepper-grid">
          <div class="stepper-box">
            <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase;">Weight (kg)</span>
            <div class="stepper-row">
              <button onclick="adjustInput('input-weight', -2.5)" class="stepper-btn">-</button>
              <input type="number" id="input-weight" placeholder="0" step="0.5" class="stepper-val" />
              <button onclick="adjustInput('input-weight', 2.5)" class="stepper-btn">+</button>
            </div>
          </div>

          <div class="stepper-box">
            <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase;">Reps</span>
            <div class="stepper-row">
              <button onclick="adjustInput('input-reps', -1)" class="stepper-btn">-</button>
              <input type="number" id="input-reps" placeholder="0" class="stepper-val" style="color:#22d3ee;" />
              <button onclick="adjustInput('input-reps', 1)" class="stepper-btn">+</button>
            </div>
          </div>
        </div>

        <button onclick="logCurrentSet()" class="btn-log">Log Set</button>
      </div>

      <div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase;">Active Sets</span>
          <span id="session-count" style="font-size:11px; font-weight:800; color:#c084fc;">0 sets</span>
        </div>

        <div id="session-sets-list" style="display:flex; flex-direction:column; gap:8px;"></div>

        <div id="finish-workout-container" style="display:none;">
          <button onclick="finishWorkoutSession()" class="btn-complete">✓ Complete & Save Workout</button>
        </div>
      </div>
    </section>

    <!-- TAB 2: HISTORY -->
    <section id="tab-history" style="display:none; flex-direction:column; gap:14px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; background:rgba(8,10,18,0.6); padding:4px; border-radius:12px;">
        <button onclick="switchHistorySubTab('workouts')" id="subtab-workouts-btn" style="padding:8px; border-radius:10px; font-size:11px; font-weight:800; border:none; background:#7e22ce; color:#ffffff; cursor:pointer;">Past Workouts</button>
        <button onclick="switchHistorySubTab('overload')" id="subtab-overload-btn" style="padding:8px; border-radius:10px; font-size:11px; font-weight:800; border:none; background:transparent; color:#64748b; cursor:pointer;">Exercise Overload</button>
      </div>

      <div id="view-past-workouts" style="display:flex; flex-direction:column; gap:10px;">
        <div id="past-workouts-list" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>

      <div id="view-overload-timeline" style="display:none; flex-direction:column; gap:10px;">
        <select id="history-filter" onchange="renderHistory()" class="custom-select"></select>
        <div id="history-timeline" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </section>

    <!-- TAB 3: VOLUME -->
    <section id="tab-analytics" style="display:none; flex-direction:column; gap:14px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="glass-card">
          <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; display:block;">Total Volume</span>
          <p id="stat-total-volume" style="font-size:19px; font-weight:800; color:#22d3ee; margin-top:4px;">0 kg</p>
        </div>
        <div class="glass-card">
          <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; display:block;">Total Sets</span>
          <p id="stat-total-sets" style="font-size:19px; font-weight:800; color:#c084fc; margin-top:4px;">0</p>
        </div>
      </div>

      <div class="glass-card">
        <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; display:block; margin-bottom:12px;">Muscle Volume Distribution</span>
        <div id="muscle-breakdown" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </section>

    <!-- TAB 4: PROFILE -->
    <section id="tab-profile" style="display:none; flex-direction:column; gap:14px;">
      <div class="glass-card" style="display:flex; flex-direction:column; gap:10px;">
        <h2 style="font-size:13px; font-weight:800; color:#ffffff;">Biometrics</h2>
        <div>
          <label style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; display:block; margin-bottom:4px;">Body Weight (kg)</label>
          <input type="number" id="input-bw" placeholder="0" step="0.5" class="custom-select" />
        </div>
        <div>
          <label style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; display:block; margin-bottom:4px;">Height (cm)</label>
          <input type="number" id="input-height" placeholder="0" class="custom-select" />
        </div>
        <button onclick="saveUserProfile()" class="btn-log" style="margin-top:6px;">Save Biometrics</button>
      </div>

      <div class="glass-card" style="display:flex; flex-direction:column; gap:10px;">
        <h2 style="font-size:13px; font-weight:800; color:#ffffff;">Backup & Restore</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <button onclick="exportData()" class="split-btn" style="color:#ffffff;">Export JSON</button>
          <button onclick="document.getElementById('import-file').click()" class="split-btn" style="color:#ffffff;">Import JSON</button>
          <input type="file" id="import-file" onchange="importData(event)" style="display:none;" accept=".json" />
        </div>
      </div>
    </section>

  </main>

  <!-- Rest Stopwatch Modal -->
  <div id="timer-modal" class="modal-overlay" style="display:none;">
    <div class="glass-card" style="width:280px; text-align:center;">
      <span style="font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:1px;">Rest Timer</span>
      <div id="modal-timer-countdown" style="font-size:42px; font-weight:800; color:#ffffff; margin:16px 0;">00:00</div>
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:14px;">
        <button onclick="startRestTimer(60)" class="split-btn" style="color:#ffffff;">60s</button>
        <button onclick="startRestTimer(90)" class="split-btn" style="color:#22d3ee; border-color:rgba(34,211,238,0.4);">90s</button>
        <button onclick="startRestTimer(120)" class="split-btn" style="color:#ffffff;">120s</button>
      </div>
      <button onclick="toggleTimerModal()" style="background:transparent; border:none; color:#64748b; font-size:11px; font-weight:700; cursor:pointer;">Dismiss</button>
    </div>
  </div>

  <!-- Bottom Navigation Dock -->
  <nav class="bottom-dock">
    <button onclick="switchTab('log')" id="nav-log" class="dock-btn active">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"/></svg>
      <span>Log</span>
    </button>
    <button onclick="switchTab('history')" id="nav-history" class="dock-btn">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      <span>History</span>
    </button>
    <button onclick="switchTab('analytics')" id="nav-analytics" class="dock-btn">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span>Volume</span>
    </button>
    <button onclick="switchTab('profile')" id="nav-profile" class="dock-btn">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <script>
    function drawNeonBicep(canvas) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = '#080a14';
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(w * 0.1, h * 0.08);
      ctx.scale(w / 45, h / 45);

      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 6;
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(8, 26);
      ctx.quadraticCurveTo(12, 19, 18, 17);
      ctx.quadraticCurveTo(24, 15, 27, 10);
      ctx.stroke();

      ctx.shadowColor = '#c084fc';
      ctx.strokeStyle = '#c084fc';
      ctx.beginPath();
      ctx.moveTo(17, 18);
      ctx.quadraticCurveTo(23, 23, 27, 26);
      ctx.quadraticCurveTo(22, 33, 14, 33);
      ctx.stroke();

      ctx.strokeStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(20, 20, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#22d3ee';
      ctx.fill();

      ctx.restore();
    }

    const ROUTINES = {
      "Push": [
        { name: "Incline DB. Press", muscle: "Upper Chest" },
        { name: "Cable Lat Raise", muscle: "Side Delts" },
        { name: "Machine Press (CL)", muscle: "Chest" },
        { name: "Overhead Tri. Ext. Bar", muscle: "Triceps" },
        { name: "Tri. Pushdown Bar", muscle: "Triceps" },
        { name: "Pec Fly (Upper/Lower)", muscle: "Chest" }
      ],
      "Pull": [
        { name: "Machine Pullovers", muscle: "Lats" },
        { name: "Wide Grip Row", muscle: "Upper Back" },
        { name: "Close grip Machine row", muscle: "Lats" },
        { name: "Cable Rear delt flys", muscle: "Rear Delts" },
        { name: "Shrugs", muscle: "Traps" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Hammer/Preacher Curl", muscle: "Biceps" }
      ],
      "Legs": [
        { name: "Hack Squat", muscle: "Quads" },
        { name: "Seated Hamstring Curl", muscle: "Hamstrings" },
        { name: "Leg Extension", muscle: "Quads" },
        { name: "Hip Adductor", muscle: "Adductors" },
        { name: "Hip Thrust", muscle: "Glutes" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Standing Calf Raise", muscle: "Calves" }
      ],
      "Arm-Shoulder": [
        { name: "Machine Shoulder Press", muscle: "Front Delts" },
        { name: "Bayesian Curl", muscle: "Biceps" },
        { name: "Cable Lateral Raise", muscle: "Side Delts" },
        { name: "Overhead Triceps Extension", muscle: "Triceps" },
        { name: "Preacher Curl", muscle: "Biceps" },
        { name: "Triceps Pushdown", muscle: "Triceps" }
      ]
    };

    let currentSplit = "Push";
    let logs = [];
    let activeSessionSets = [];
    let userProfile = { weight: 70, height: 175 };
    let restTimerInterval = null;
    let restTimeRemaining = 0;

    try {
      logs = JSON.parse(localStorage.getItem("iron_logs") || "[]");
      activeSessionSets = JSON.parse(localStorage.getItem("iron_active_session") || "[]");
      userProfile = JSON.parse(localStorage.getItem("iron_profile") || '{"weight": 70, "height": 175}');
    } catch(e) {}

    function startApp() {
      const cv = document.getElementById('logo-canvas');
      if (cv) drawNeonBicep(cv);

      renderSplitButtons();

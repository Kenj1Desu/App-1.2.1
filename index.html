<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030308" />
  <title>Kenji Lifts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link id="app-favicon" rel="icon" type="image/png" href="" />
  <link id="app-apple-icon" rel="apple-touch-icon" href="" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030308;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 95px;
      overflow-x: hidden;
    }

    /* Moody Ambient Background */
    .aurora-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.22;
    }
    .blob-1 {
      width: 320px;
      height: 320px;
      background: #7e22ce;
      top: -40px;
      right: -80px;
    }
    .blob-2 {
      width: 340px;
      height: 340px;
      background: #0891b2;
      bottom: 20%;
      left: -100px;
    }

    /* Core Layout */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(10, 12, 20, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .main-wrap {
      position: relative;
      z-index: 10;
      max-width: 440px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Glass Cards & Elements */
    .glass-card {
      background: rgba(15, 17, 26, 0.82);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
    }

    .glass-well {
      background: rgba(5, 6, 12, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 12px;
    }

    /* Split Selector Buttons */
    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .split-btn {
      padding: 10px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: rgba(8, 10, 16, 0.7);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s ease;
    }
    .split-btn.active {
      background: rgba(126, 34, 206, 0.28);
      color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.5);
      box-shadow: 0 0 16px rgba(126, 34, 206, 0.25);
    }

    /* Inputs & Select */
    .select-wrap {
      position: relative;
    }
    .custom-select {
      width: 100%;
      background: rgba(15, 17, 26, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      appearance: none;
    }
    .custom-select option {
      background: #090b12;
      color: #ffffff;
    }

    /* Stepper UI */
    .stepper-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0;
    }
    .stepper-box {
      background: rgba(5, 6, 12, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px;
      text-align: center;
    }
    .stepper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
    }
    .stepper-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .stepper-btn:active {
      transform: scale(0.88);
    }
    .stepper-val {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Action Buttons */
    .btn-log {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: linear-gradient(135deg, rgba(126, 34, 206, 0.75) 0%, rgba(14, 116, 144, 0.75) 100%);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(126, 34, 206, 0.25);
    }
    .btn-log:active {
      transform: scale(0.97);
    }

    .btn-complete {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(34, 211, 238, 0.4);
      background: rgba(8, 51, 68, 0.85);
      color: #a5f3fc;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Bottom Dock Navigation */
    .bottom-dock {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      max-width: 440px;
      margin: 0 auto;
      z-index: 40;
      display: flex;
      justify-content: space-around;
      background: rgba(10, 12, 20, 0.92);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.1);
